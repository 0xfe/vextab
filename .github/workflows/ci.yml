name: CI
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release tag against package version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Verify the importer, packed consumers and repertoire references
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm ci --prefix importer --ignore-scripts
          npm test --prefix importer
          node issues/207/consumer.mjs
          node issues/208/check.mjs
          node issues/209/check-native.mjs
          node issues/210/capacity.mjs
          python3 issues/210/fetch-exporters.py
          node issues/210/exporters.mjs
          node issues/210/lilypond-upstream.mjs
          node issues/210/movement.mjs
          node issues/210/browser.mjs
          node issues/210/movement.mjs --expressive
          node issues/211/musicxml.mjs
          node issues/211/browser.mjs
          node issues/211/check-lily-repertoire.mjs
          node issues/211/sor-proof.mjs
          node issues/212/musicxml-full.mjs --held-out
          node issues/212/lilypond/check.mjs
          node issues/212/lilypond/coverage.mjs
          node issues/212/generated.mjs
          node issues/212/matrix.mjs
          node issues/212/browser.mjs
          node issues/212/musicxml-surfaces.mjs
          node issues/219/engraving.mjs
          node issues/219/lilypond-directions.mjs
      - name: Verify the hosted guide and optional importer gallery
        run: npm run test:import-guide
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Audit the independent npm dependency graphs
        run: |
          npm audit --prefix tools
          npm audit --prefix importer
          npm audit --prefix issues/206
      - run: npm run build -- --json "$RUNNER_TEMP/vextab-webpack.json"
      - name: Pack the distribution and test the files consumers receive
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          mkdir "$RUNNER_TEMP/assets" "$RUNNER_TEMP/unpacked"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/assets"
          tar -xzf "$RUNNER_TEMP"/assets/*.tgz -C "$RUNNER_TEMP/unpacked"
          node issues/212/host-package.mjs "$RUNNER_TEMP/unpacked/package" "$RUNNER_TEMP/vextab-webpack.json"
          node scripts/test-browser.mjs "$RUNNER_TEMP/unpacked/package/dist"
          node scripts/test-consumer.mjs "$RUNNER_TEMP"/assets/*.tgz
          npm run test:baseline -- "$RUNNER_TEMP/unpacked/package/dist"
      - name: Check the packed guide in Firefox and WebKit
        if: github.ref_type == 'tag' || github.base_ref == 'grammar-v2-development' || github.head_ref == 'grammar-v2-development'
        run: |
          npx --no-install playwright-core install --with-deps firefox webkit
          # Firefox and WebKit need an active audio destination for the real SoundFont PCM check.
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=vextab
          pactl set-default-sink vextab
          VEXTAB_BROWSER=firefox node scripts/test-browser.mjs "$RUNNER_TEMP/unpacked/package/dist"
          VEXTAB_BROWSER=webkit node scripts/test-browser.mjs "$RUNNER_TEMP/unpacked/package/dist"
      - name: Use the importer's minimum supported Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Verify the packed importer's minimum Node version
        run: node issues/207/consumer.mjs --node-only
      - name: Prepare standalone downloads and checksums
        if: github.ref_type == 'tag'
        run: |
          cd "$RUNNER_TEMP/unpacked/package/dist"
          cp main.prod.js div.dev.js div.prod.js div.prod.js.map vextab-div.js vextab.css "$RUNNER_TEMP/assets/"
          cd "$RUNNER_TEMP/assets"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # gh reads the release notes from the annotated tag in this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
      - name: Verify downloads and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd "$RUNNER_TEMP/assets" && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/assets/* \
            --verify-tag --notes-from-tag --title "VexTab $GITHUB_REF_NAME"
