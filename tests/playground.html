<html>

<head>
    <title>VexTab Playground</title>
    <style type="text/css">
        body {
            padding: 20px;
            font-family: Academico, Georgia, serif;
            font-size: 12px;
            color: #554;
            margin: 0px;
            height: 80%;
        }

        [data-preview-stale="true"] { opacity: 0.65; }

        #error {
            white-space: pre-wrap;
            font-family: Courier;
            color: red;
            width: 600;
        }

        textarea#blah {
            width: 500px;
            height: 300px;
            font-family: Courier;
            font-size: 12px;
            padding: 10px;
            margin-top: 40px;
            border: #eee solid 10px;
        }
    </style>
</head>

<body>
    <h1>VexTab Playground</h1>
    <p><a href="guide/index.html#playground/first-fret">Open the VexTab 6 playground and demo scores</a></p>

    <div style="float:left;width:600;">
        <div id="boo"></div>
        <div id="error" role="status"></div>
    </div>

    <div style="float:left;">
        <textarea id="blah">meter 4/4
meter 5/4 at 2
meter 4/4 at 3
meter 7/8 at 4
guitar { key A key C at 3
  tabStems on tabDirection down
  repeatStart :q (5/2 5/3 7/4) :8 tuplet 3:2 { 7/3 5/3 6/3[hammer] }
  tuplet 3:2 { 5/5 6/5[hammer] 7/5 } :q 7/4[vibrato wide] |
  :8 12/4[tap] 7/4[pull] 5/4[slide] 3/4[slide] 3/5 :16 5/5[slide] 7/5 :h 5/4 |
  break system :q tuplet 3:2 { (5/4 5/5) (7/4 7/5) (5/4[slide] 5/5[slide]) }
  :8 7/4 5/4[staccato below] (5/4 5/5) 7/5[hammer] bar repeatEnd
  :8 (12/5 12/4)[stroke down] (5/5[slide] 5/4[slide])[stroke up] 3/5[bend +1 rise=1]
  :h (5/6 5/4 6/3 7/2)[vibrato wide, label "let ring" style italic] bar final
  text roadmap line 10 {
    start sign segno :w skip | :h. skip :h sign tr |
    :h skip "D.S. al coda" end sign coda | :8 skip :h. "A13" |
  }
  text dynamics line 14 { :w skip | :w skip :q skip | :w sign f | :h. skip :8 skip | }
}</textarea>
    </div>
</body>

</html>
