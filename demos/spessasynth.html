<!doctype html>
<!-- A manually mounted SoundFont example with the same offline instrument as the guide. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpessaSynth playback · VexTab</title>
<style>
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
  #score { overflow-x: auto; }
</style>
<h1>SpessaSynth playback</h1>
<p>Press Play to hear the third string release over a steady open bass. Change the fret or tempo and play it again.</p>
<div id="score" data-language="2" layout="flow" editor="true">play { tempo 80 instrument 24 }
meter 2/4
guitar { :q (0/6 7/3[prebend +1 release]) 7/3 | }</div>
<script src="../dist/div.dev.js"></script>
<script src="../dist/example-audio.dev.js"></script>
<script>
  const host = document.getElementById('score');
  new vextab.Div(host, VexTabAudio.scoreOptions(host));
</script>
</html>
