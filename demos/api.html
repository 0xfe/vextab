<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VexTab API Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }
      #boo {
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <h1>VexTab API Demo</h1>
    <p>Uses the public API similar to the README example.</p>
    <div id="boo"></div>

    <script src="/dist/vexflow.js"></script>
    <script src="/dist/main.dev.js"></script>
    <script src="../dist/example-audio.dev.js"></script>
    <script>
      const host = document.querySelector('#boo');
      const source = 'meter 4/4 guitar { key A :q 5/2 7/2 8/2 7/2 | }';
      const score = vextab.parseScore(source);
      vextab.renderScore(host, score, { width: 600 });
      host.dataset.source = source;
      if (window.VexTabAudio) {
        const { playback } = VexTabAudio.scoreOptions(host);
        new vextab.Player(score, { playback }).render(host.querySelector('svg'));
      }
    </script>
  </body>
</html>
