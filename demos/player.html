<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VexTab playback</title>
<style>
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #222; background: white; font: 16px/1.5 system-ui, sans-serif; }
</style>
<h1>VexTab playback</h1>
<h2>Bass chords</h2>
<div class="vex-tabdiv" width="440">play { tempo 140 }
meter 4/4
staff {
  clef bass
  :q (C2 G2) (C2 A2) (C2 G2) (C2 A2) |
}</div>
<h2>Pre-bend and release</h2>
<div class="vex-tabdiv" width="440">play { tempo 80 }
meter 2/4
guitar {
  :q (0/6 7/3[prebend +1 release]) 7/3 |
}</div>
<script src="../dist/vexflow.js"></script>
<script src="../dist/vextab-div.js"></script>
</html>
