<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="<%= require('./style.css') %>">
  <title>VexTab · User guide</title>
</head>
<body>
<a class="skip" href="#main">Skip to guide content</a>
<header>
  <a class="brand" href="#tutorial">VexTab</a>
  <nav aria-label="Guide sections">
    <a href="#tutorial">Tutorial</a><a href="#features">Features</a><a href="#studies">Studies</a>
    <a href="#reference">API reference</a><a href="#playground/first-fret">Playground</a>
  </nav>
</header>
<div class="book">
  <aside>
    <button id="menu" aria-expanded="false" aria-controls="contents">Contents <span aria-hidden="true">☰</span></button>
    <nav id="contents" aria-label="Section contents"></nav>
  </aside>
  <main id="main" tabindex="-1">
    <section id="index"></section>
    <article id="lesson" hidden>
      <p class="chapter-label" id="lesson-section"></p>
      <label id="picker-label" hidden>Playground score <select id="picker"></select></label>
      <h1 id="title"></h1><p class="goal" id="goal"></p>
      <div class="bench">
      <div class="toolbar"><label>View <select id="view"></select></label><label id="narrow-control"><input id="narrow" type="checkbox"> Narrow score</label></div>
      <div id="score"></div>
      <div class="actions"><button id="run">Run</button><button id="reset">Reset example</button><button id="error" disabled>Find error</button><button id="copy">Copy source</button><button id="save">Save source</button><label class="open">Open source <input type="file" id="open" accept=".vextab,.txt,text/plain"></label></div>
      </div>
      <p id="notice" role="status"></p>
      <section id="reader" aria-label="Score reader">
        <h2>Read the score</h2><p aria-live="polite" id="reading"></p>
        <div class="actions"><button id="previous">Previous event</button><button id="next">Next event</button><button id="select">Select source</button></div>
      </section>
      <section id="workbench" hidden><h2>Second editor</h2><div id="second"></div></section>
      <section id="printing" hidden><h2>Engrave the duet</h2><div class="toolbar">
        <label>Edition <select id="player"><option value="1">Guitar 1</option><option value="2">Guitar 2</option><option value="score">Full score</option></select></label>
        <label>Paper <select id="paper"><option>A4</option><option>Letter</option></select></label>
        <button id="print" disabled>Print</button><button id="save-print" disabled>Save print HTML</button>
        <label id="svg-page-label" hidden>Page <select id="svg-page"></select></label><button id="save-svg" disabled>Save SVG</button></div><p id="print-status" role="status"></p><div id="part"></div>
      </section>
      <section class="exercise"><h2>Try it</h2><p id="exercise"></p></section>
      <footer><a id="original">Open original source</a><a id="play"></a></footer>
    </article>
  </main>
</div>
</body>
</html>
